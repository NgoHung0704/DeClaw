name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Windows because that is the only environment where this suite has been
    # observed green. Claiming Linux-green without running it would be the
    # same error class the docs guards exist to prevent.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy declaw declaw_plugin_sdk
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules --test tests/gateway/ui-behavior.test.cjs

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.100.0 fmt --manifest-path tauri/src-tauri/Cargo.toml --check
      - run: cargo +1.100.0 clippy --manifest-path tauri/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.100.0 test --manifest-path tauri/src-tauri/Cargo.toml --locked
      - run: cargo +1.100.0 build --manifest-path tauri/src-tauri/Cargo.toml --locked
