[project]
name = "declaw"
version = "0.1.0"
description = "Your private AI agent. Runs local. Explains everything."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "DeClaw Core Team"}]

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Agent
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",

    # DB
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Memory
    "chromadb>=0.5.0",
    "cryptography>=43.0.0",

    # Sandbox
    "docker>=7.1.0",

    # Document parsing (doc-intel plugin)
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "unstructured>=0.16.0",

    # Browser (Phase 2)
    "playwright>=1.48.0",

    # Scheduler (Phase 2)
    "apscheduler>=4.0.0a5",

    # Credentials
    "keyring>=25.5.0",

    # Security
    "pynacl>=1.5.0",  # ed25519 for plugin signatures

    # Utils
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "loguru>=0.7.0",
    "watchdog>=5.0.0",  # file watcher for doc-intel
]

[project.scripts]
declaw = "declaw.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["declaw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
