<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeClaw</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>DeClaw</h1><p id="status" role="status">Desktop core is stopped.</p>
<label for="language">Language / Langue</label><select id="language"><option value="en">English</option><option value="fr">Français</option></select>
<div id="actions"><button id="start">Start</button><button id="stop">Stop</button><button id="restart">Restart</button><button id="reveal">Show login token</button></div>
<p id="help">Closing this window keeps DeClaw in the tray. Use Quit to stop it.</p>
<output id="token" hidden></output><button id="clear" hidden>Hide token</button>
</main><script src="app.js"></script></body></html>
